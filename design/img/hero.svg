<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2d44"/>
      <stop offset=".45" stop-color="#4b6378"/>
      <stop offset=".75" stop-color="#c9b48d"/>
      <stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".68" cy=".62" r=".35">
      <stop offset="0" stop-color="#fff3d6" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#f3d9a4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f3d9a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#efe6d2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#efe6d2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#b9c7cf" stop-opacity=".6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <!-- far range (snow capped) -->
  <path d="M0 610 L140 520 L230 560 L380 430 L470 480 L560 400 L640 450 L760 360 L860 430 L980 380 L1080 450 L1200 390 L1320 470 L1440 420 L1600 500 L1600 1000 L0 1000Z" fill="#7d8ea0"/>
  <path d="M560 400 L600 425 L585 430 L620 446 L640 450 L600 420Z M760 360 L800 392 L780 395 L830 415 L860 430 L810 395Z M1200 390 L1240 420 L1225 424 L1270 440 L1230 412Z" fill="#eef0ef" opacity=".85"/>
  <rect y="470" width="1600" height="160" fill="url(#mist)" filter="url(#blur)"/>
  <!-- mid range -->
  <path d="M0 700 L120 640 L260 690 L400 600 L520 660 L640 610 L780 680 L900 620 L1040 690 L1180 630 L1320 700 L1460 640 L1600 690 L1600 1000 L0 1000Z" fill="#4d6474"/>
  <rect y="620" width="1600" height="140" fill="url(#mist)" filter="url(#blur)" opacity=".8"/>
  <!-- gorge walls (Sounkyo-like cliffs) -->
  <path d="M0 760 L60 700 L90 720 L130 660 L170 690 L210 640 L250 700 L300 690 L360 760 L420 800 L520 860 L0 1000Z" fill="#2f4a3a"/>
  <path d="M1600 740 L1540 690 L1500 720 L1460 650 L1420 700 L1380 660 L1330 720 L1280 730 L1220 780 L1140 840 L1060 900 L1600 1000Z" fill="#2f4a3a"/>
  <g stroke="#243a2e" stroke-width="3" opacity=".7">
    <line x1="130" y1="680" x2="150" y2="880"/><line x1="210" y1="660" x2="225" y2="860"/><line x1="1460" y1="670" x2="1450" y2="880"/><line x1="1380" y1="680" x2="1372" y2="870"/>
  </g>
  <!-- river (Ishikari headwaters) -->
  <path d="M760 1000 C760 920, 860 900, 820 850 C790 815, 880 800, 860 770 C845 750, 890 740, 880 725 L900 725 C915 742, 870 752, 885 772 C910 805, 820 822, 850 852 C895 900, 820 930, 860 1000Z" fill="url(#river)"/>
  <!-- foreground forest -->
  <g fill="#1d3127">
    <path d="M0 1000 L0 860 L30 800 L60 860 L80 790 L110 860 L140 820 L170 870 L200 810 L240 880 L280 840 L320 900 L360 860 L420 920 L520 940 L640 960 L700 1000Z"/>
    <path d="M1600 1000 L1600 850 L1570 790 L1540 850 L1510 780 L1480 850 L1450 810 L1420 870 L1390 800 L1350 880 L1310 840 L1260 900 L1200 880 L1120 930 L1000 960 L940 1000Z"/>
  </g>
</svg>
